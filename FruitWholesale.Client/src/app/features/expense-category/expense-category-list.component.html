<div class="page-toolbar">
  <h1>Expense Categories</h1>
  <mat-form-field subscriptSizing="dynamic" class="search-field">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput placeholder="Search categories..." (input)="onSearch($any($event.target).value)" />
  </mat-form-field>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Category
  </button>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-container">
  <table mat-table [dataSource]="items()" matSort (matSortChange)="onSort($event)">
    <ng-container matColumnDef="categoryName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Category Name</th>
      <td mat-cell *matCellDef="let row">{{ row.categoryName }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        <mat-slide-toggle [checked]="row.isActive" (change)="toggleActive(row)"></mat-slide-toggle>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button matTooltip="Edit" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!loading() && items().length === 0) {
    <div class="empty-state">
      <mat-icon>category</mat-icon>
      <p>No expense categories found. Add your first category to get started.</p>
    </div>
  }
</div>

<mat-paginator [length]="totalCount()" [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" (page)="onPage($event)"></mat-paginator>
