<div class="modal-header">
  <div>
    <h2>{{ data ? 'Edit Category' : 'Add Category' }}</h2>
    <p>Used to group daily expenses.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Category Name</span>
    <input class="field-input" formControlName="categoryName" />
    @if (form.controls.categoryName.touched && form.controls.categoryName.hasError('required')) {
      <span class="field-error">Category name is required</span>
    }
  </label>

  <label class="field">
    <span class="field-label">Description</span>
    <textarea class="field-input" formControlName="description" rows="2"></textarea>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save</button>
  </div>
</form>
