<div class="modal-header">
  <div>
    <h2>{{ data ? 'Edit Work Entry' : 'New Work Entry' }}</h2>
    <p>Every entry with an amount books a cash-out entry.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Employee</span>
    <select class="field-input" formControlName="employeeID">
      <option [ngValue]="null">Select an employee</option>
      @for (employee of employees(); track employee.employeeID) {
        <option [ngValue]="employee.employeeID">{{ employee.fullName }}</option>
      }
    </select>
    @if (form.controls.employeeID.touched && form.controls.employeeID.hasError('required')) {
      <span class="field-error">Employee is required</span>
    }
  </label>

  <div class="field-row">
    <label class="field">
      <span class="field-label">Job type</span>
      <select class="field-input" formControlName="jobType">
        @for (job of jobTypes; track job) {
          <option [value]="job">{{ job }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="field-label">Date</span>
      <input class="field-input" type="date" formControlName="workDate" (click)="$any($event.target).showPicker?.()" />
    </label>
  </div>

  @if (showRoute()) {
    <label class="field">
      <span class="field-label">Route</span>
      <select class="field-input" formControlName="routeID">
        <option [ngValue]="null">No specific route</option>
        @for (route of routes(); track route.routeID) {
          <option [ngValue]="route.routeID">{{ route.routeName }}</option>
        }
      </select>
    </label>
  }

  <label class="field">
    <span class="field-label">Amount</span>
    <span class="amount-input">
      <span class="rupee">₹</span>
      <input type="number" formControlName="amount" />
    </span>
  </label>

  <label class="field">
    <span class="field-label">Payment mode</span>
    <div class="mode-row">
      @for (mode of paymentModes; track mode) {
        <button type="button" class="mode-btn" [class.mode-btn--active]="form.value.paymentMode === mode" (click)="setPaymentMode(mode)">{{ mode }}</button>
      }
    </div>
  </label>

  <label class="field">
    <span class="field-label">Remarks</span>
    <textarea class="field-input" formControlName="remarks" rows="2" placeholder="Optional"></textarea>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save entry</button>
  </div>
</form>
