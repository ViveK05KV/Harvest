<div class="modal-header">
  <div>
    <h2>{{ data ? 'Edit Expense' : 'New Expense' }}</h2>
    <p>Books a cash-out entry against the chosen category.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Category</span>
    <select class="field-input" formControlName="expenseCategoryID">
      <option [ngValue]="null">Select a category</option>
      @for (category of categories(); track category.expenseCategoryID) {
        <option [ngValue]="category.expenseCategoryID">{{ category.categoryName }}</option>
      }
    </select>
    @if (form.controls.expenseCategoryID.touched && form.controls.expenseCategoryID.hasError('required')) {
      <span class="field-error">Category is required</span>
    }
  </label>

  <div class="field-row">
    <label class="field">
      <span class="field-label">Amount</span>
      <span class="amount-input">
        <span class="rupee">₹</span>
        <input type="number" formControlName="amount" />
      </span>
    </label>
    <label class="field">
      <span class="field-label">Date</span>
      <input class="field-input" type="date" formControlName="expenseDate" (click)="$any($event.target).showPicker?.()" />
    </label>
  </div>

  <label class="field">
    <span class="field-label">Payment mode</span>
    <div class="mode-row">
      @for (mode of paymentModes; track mode) {
        <button type="button" class="mode-btn" [class.mode-btn--active]="form.value.paymentMode === mode" (click)="setPaymentMode(mode)">{{ mode }}</button>
      }
    </div>
  </label>

  <label class="field">
    <span class="field-label">Paid to</span>
    <input class="field-input" formControlName="paidTo" placeholder="Person or vendor" />
  </label>

  <label class="field">
    <span class="field-label">Description</span>
    <textarea class="field-input" formControlName="description" rows="2" placeholder="Optional"></textarea>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save expense</button>
  </div>
</form>
