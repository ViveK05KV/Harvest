<div class="modal-header">
  <div>
    <h2>Stock Adjustment</h2>
    <p>Manual correction; posts a stock ledger entry.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Fruit</span>
    <select class="field-input" formControlName="fruitID">
      <option [ngValue]="null">Select a fruit</option>
      @for (fruit of fruits(); track fruit.fruitID) {
        <option [ngValue]="fruit.fruitID">{{ fruit.fruitName }} ({{ fruit.unit }})</option>
      }
    </select>
    @if (form.controls.fruitID.touched && form.controls.fruitID.hasError('required')) {
      <span class="field-error">Fruit is required</span>
    }
  </label>

  <label class="field">
    <span class="field-label">Direction</span>
    <div class="mode-row">
      <button type="button" class="mode-btn" [class.mode-btn--active]="form.value.isIncrease === true" (click)="setDirection(true)">Increase Stock</button>
      <button type="button" class="mode-btn" [class.mode-btn--active]="form.value.isIncrease === false" (click)="setDirection(false)">Decrease Stock</button>
    </div>
  </label>

  <label class="field">
    <span class="field-label">Quantity</span>
    <input class="field-input" type="number" formControlName="quantity" min="0.001" step="0.001" />
    @if (form.controls.quantity.touched && form.controls.quantity.invalid) {
      <span class="field-error">Enter a valid quantity</span>
    }
  </label>

  <label class="field">
    <span class="field-label">Narration / Reason</span>
    <textarea class="field-input" formControlName="narration" rows="2" placeholder="Spoilage, recount, correction"></textarea>
    @if (form.controls.narration.touched && form.controls.narration.hasError('required')) {
      <span class="field-error">Narration is required</span>
    }
  </label>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Apply</button>
  </div>
</form>
