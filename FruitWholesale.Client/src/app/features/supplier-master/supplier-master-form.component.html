<h2 mat-dialog-title>{{ isEdit ? 'Edit Supplier' : 'Add Supplier' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field class="full-width">
      <mat-label>Supplier Name</mat-label>
      <input matInput formControlName="supplierName" />
      @if (form.controls.supplierName.touched && form.controls.supplierName.hasError('required')) {
        <mat-error>Supplier name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Address</mat-label>
      <textarea matInput formControlName="address" rows="2"></textarea>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Opening Balance</mat-label>
      <input matInput type="number" formControlName="openingBalance" />
      @if (isEdit) {
        <mat-hint>Use the Adjust Balance action to correct balances after creation</mat-hint>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save</button>
  </mat-dialog-actions>
</form>
