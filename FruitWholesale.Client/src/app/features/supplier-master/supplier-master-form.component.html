<div class="modal-header">
  <div>
    <h2>{{ isEdit ? 'Edit Supplier' : 'Add Supplier' }}</h2>
    <p>Supplier master record.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Supplier Name</span>
    <input class="field-input" formControlName="supplierName" />
    @if (form.controls.supplierName.touched && form.controls.supplierName.hasError('required')) {
      <span class="field-error">Supplier name is required</span>
    }
  </label>

  <label class="field">
    <span class="field-label">Phone</span>
    <input class="field-input" formControlName="phone" />
  </label>

  <label class="field">
    <span class="field-label">Address</span>
    <textarea class="field-input" formControlName="address" rows="2"></textarea>
  </label>

  <label class="field">
    <span class="field-label">Opening Balance</span>
    <input class="field-input" type="number" formControlName="openingBalance" />
    @if (isEdit) {
      <span class="field-hint">Use Adjust Balance to correct balances after creation</span>
    }
  </label>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save</button>
  </div>
</form>
