<div class="modal-header">
  <div>
    <h2>{{ data ? 'Edit Employee' : 'Add Employee' }}</h2>
    <p>Plain staff directory; work is logged per day.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Full Name</span>
    <input class="field-input" formControlName="fullName" />
    @if (form.controls.fullName.touched && form.controls.fullName.hasError('required')) {
      <span class="field-error">Full name is required</span>
    }
  </label>

  <label class="field">
    <span class="field-label">Phone</span>
    <input class="field-input" formControlName="phone" />
  </label>

  <label class="field">
    <span class="field-label">Address</span>
    <textarea class="field-input" formControlName="address" rows="2"></textarea>
  </label>

  <div class="field-row">
    <label class="field">
      <span class="field-label">Salary Type</span>
      <div class="mode-row">
        @for (type of salaryTypes; track type) {
          <button type="button" class="mode-btn" [class.mode-btn--active]="form.value.salaryType === type" (click)="setSalaryType(type)">{{ type }}</button>
        }
      </div>
    </label>
    <label class="field">
      <span class="field-label">{{ form.value.salaryType === 'Daily' ? 'Daily Rate' : 'Monthly Salary' }}</span>
      <span class="amount-input">
        <span class="rupee">₹</span>
        <input type="number" formControlName="salaryAmount" />
      </span>
    </label>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save</button>
  </div>
</form>
