<div class="modal-header">
  <div>
    <h2>{{ isEdit ? 'Edit Shop' : 'Add Shop' }}</h2>
    <p>Customer master record.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Shop Name</span>
    <input class="field-input" formControlName="shopName" />
    @if (form.controls.shopName.touched && form.controls.shopName.hasError('required')) {
      <span class="field-error">Shop name is required</span>
    }
  </label>

  <div class="field-row">
    <label class="field">
      <span class="field-label">Owner Name</span>
      <input class="field-input" formControlName="ownerName" />
    </label>
    <label class="field">
      <span class="field-label">Phone</span>
      <input class="field-input" formControlName="phone" />
    </label>
  </div>

  <label class="field">
    <span class="field-label">Address</span>
    <textarea class="field-input" formControlName="address" rows="2"></textarea>
  </label>

  <div class="field-row">
    <label class="field">
      <span class="field-label">Supply Route</span>
      <select class="field-input" formControlName="routeID">
        <option [ngValue]="null">No route assigned</option>
        @for (route of routes(); track route.routeID) {
          <option [ngValue]="route.routeID">{{ route.routeName }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="field-label">Linked Supplier</span>
      <select class="field-input" formControlName="linkedSupplierID">
        <option [ngValue]="null">Not linked</option>
        @for (supplier of suppliers(); track supplier.supplierID) {
          <option [ngValue]="supplier.supplierID">{{ supplier.supplierName }}</option>
        }
      </select>
    </label>
  </div>
  <p class="field-hint">If this shop is also one of your suppliers, link it to see a combined net balance.</p>

  <div class="field-row">
    <label class="field">
      <span class="field-label">Opening Balance</span>
      <input class="field-input" type="number" formControlName="openingBalance" />
      @if (isEdit) {
        <span class="field-hint">Use Adjust Balance to correct balances after creation</span>
      }
    </label>
    <label class="field">
      <span class="field-label">Credit Limit</span>
      <input class="field-input" type="number" formControlName="creditLimit" />
    </label>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save</button>
  </div>
</form>
