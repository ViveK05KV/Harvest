<div class="modal-header">
  <div>
    <h2>Customers on {{ route.routeName }}</h2>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="close()"><mat-icon>close</mat-icon></button>
</div>

<div class="modal-body">
  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="32" />
    </div>
  } @else if (shops().length === 0) {
    <p class="field-hint">No customers assigned to this route.</p>
  } @else {
    <div class="shop-rows">
      @for (shop of shops(); track shop.shopID) {
        <div class="shop-row">
          <mat-icon>store</mat-icon>
          <div class="shop-row-text">
            <span class="shop-row-name">{{ shop.shopName }}</span>
            <span class="shop-row-sub">{{ shop.ownerName || 'No owner listed' }}{{ shop.phone ? ' · ' + shop.phone : '' }}</span>
          </div>
        </div>
      }
    </div>
  }
</div>
