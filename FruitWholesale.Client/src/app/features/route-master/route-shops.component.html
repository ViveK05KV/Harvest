<h2 mat-dialog-title>Shops on {{ route.routeName }}</h2>
<mat-dialog-content>
  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="32" />
    </div>
  } @else if (shops().length === 0) {
    <p class="muted">No shops assigned to this route.</p>
  } @else {
    <mat-list>
      @for (shop of shops(); track shop.shopID) {
        <mat-list-item>
          <mat-icon matListItemIcon>store</mat-icon>
          <span matListItemTitle>{{ shop.shopName }}</span>
          <span matListItemLine>{{ shop.ownerName || 'No owner listed' }}{{ shop.phone ? ' · ' + shop.phone : '' }}</span>
        </mat-list-item>
      }
    </mat-list>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
