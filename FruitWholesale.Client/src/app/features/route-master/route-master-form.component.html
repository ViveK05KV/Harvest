<div class="modal-header">
  <div>
    <h2>{{ data ? 'Edit Route' : 'Add Route' }}</h2>
    <p>Groups shops into a delivery run.</p>
  </div>
  <span class="spacer"></span>
  <button type="button" class="close-btn" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="modal-body">
  <label class="field">
    <span class="field-label">Route Name</span>
    <input class="field-input" formControlName="routeName" placeholder="e.g. North City Route" />
    @if (form.controls.routeName.touched && form.controls.routeName.hasError('required')) {
      <span class="field-error">Route name is required</span>
    }
  </label>

  <label class="field">
    <span class="field-label">Description</span>
    <textarea class="field-input" formControlName="description" rows="2"></textarea>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-primary"><mat-icon>check</mat-icon>Save</button>
  </div>
</form>
