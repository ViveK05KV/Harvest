<div class="page-toolbar">
  <h1>Fruit Master</h1>
  <mat-form-field subscriptSizing="dynamic" class="search-field">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput placeholder="Search fruits..." (input)="onSearch($any($event.target).value)" />
  </mat-form-field>
  <button mat-icon-button [matMenuTriggerFor]="exportMenu" matTooltip="Export">
    <mat-icon>download</mat-icon>
  </button>
  <mat-menu #exportMenu="matMenu">
    <button mat-menu-item (click)="exportExcel()"><mat-icon>grid_on</mat-icon>Export to Excel</button>
    <button mat-menu-item (click)="exportPdf()"><mat-icon>picture_as_pdf</mat-icon>Export to PDF</button>
  </mat-menu>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Fruit
  </button>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-container">
  <table mat-table [dataSource]="items()" matSort (matSortChange)="onSort($event)">
    <ng-container matColumnDef="fruitName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fruit Name</th>
      <td mat-cell *matCellDef="let row">{{ row.fruitName }}</td>
    </ng-container>

    <ng-container matColumnDef="unit">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Unit</th>
      <td mat-cell *matCellDef="let row">{{ row.unit }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        <mat-slide-toggle [checked]="row.isActive" (change)="toggleActive(row)"></mat-slide-toggle>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button matTooltip="Edit" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!loading() && items().length === 0) {
    <div class="empty-state">
      <mat-icon>nutrition</mat-icon>
      <p>No fruits found. Add your first fruit to get started.</p>
    </div>
  }
</div>

<mat-paginator [length]="totalCount()" [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" (page)="onPage($event)"></mat-paginator>
