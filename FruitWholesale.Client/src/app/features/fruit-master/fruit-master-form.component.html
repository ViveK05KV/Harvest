<h2 mat-dialog-title>{{ data ? 'Edit Fruit' : 'Add Fruit' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field class="full-width">
      <mat-label>Fruit Name</mat-label>
      <input matInput formControlName="fruitName" />
      @if (form.controls.fruitName.touched && form.controls.fruitName.hasError('required')) {
        <mat-error>Fruit name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Unit</mat-label>
      <mat-select formControlName="unit">
        @for (unit of units; track unit) {
          <mat-option [value]="unit">{{ unit }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save</button>
  </mat-dialog-actions>
</form>
