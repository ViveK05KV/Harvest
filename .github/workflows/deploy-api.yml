name: Deploy API to AWS Lambda

# Deploys the ASP.NET Core API to AWS Lambda (Singapore, arm64, custom runtime ZIP).
# Runs on pushes to main that touch backend code, or manually via the "Run workflow" button.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "database/**"
      - "FruitWholesale.slnx"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC -> AWS
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Amazon.Lambda.Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426187995582:role/harvest-github-deploy
          aws-region: ap-southeast-1

      - name: Deploy to Lambda
        working-directory: src/FruitWholesale.Api
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Flags come from aws-lambda-tools-defaults.json (runtime, arch, memory, role, etc.)
          dotnet lambda deploy-function
