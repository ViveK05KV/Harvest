name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FruitWholesale.slnx

      - name: Build
        run: dotnet build FruitWholesale.slnx --no-restore -c Release

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FruitWholesale.Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: FruitWholesale.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production
